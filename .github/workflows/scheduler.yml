name: Reliance GRN Scheduler

on:
  # Run every 3 hours
  schedule:
    - cron: '38 */3 * * *'  # At minute 0 past every 3rd hour

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    # Backstop only. The job's own --budget-minutes stops it first;
    # GitHub's default is 360 minutes, which let a stuck run keep
    # writing for 3h16m on 2026-08-31.
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Decode and restore credentials
      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
          echo "$GOOGLE_TOKEN" | base64 -d > token.json
          echo "✅ Credentials restored"

      # 5. Set environment variables
      - name: Set environment variables
        env:
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          echo "LLAMA_CLOUD_API_KEY=$LLAMA_API_KEY" >> $GITHUB_ENV

      # 6. Run the workflow (single execution, not the continuous scheduler in
      #    app.py's __main__ block)
      - name: Run workflow
        run: |
          echo "🚀 Starting Reliance GRN workflow..."
          python -u -c "
          from app import RelianceAutomation, run_combined_workflow
          automation = RelianceAutomation()
          if not automation.authenticate():
              print('❌ Authentication failed')
              exit(1)
          run_combined_workflow(automation)
          " 2>&1 | tee reliance_scheduler.log

      # Write the same Drive files to Supabase. Separate entry point from
      # the step above, which still writes to Google Sheets. --source is
      # explicit because .env is gitignored and the sink would otherwise
      # default to instamart.
      - name: Drive -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u supabase_sink.py --run --source reliance --budget-minutes 45

      # 7. Cleanup
      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json token.json
          echo "🧹 Cleaned up temporary files"

      # 8. Upload logs as artifact
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliance-workflow-logs-${{ github.run_number }}
          path: reliance_scheduler.log
          retention-days: 30
